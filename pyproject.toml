[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "spirit-agent"
version = "0.1.0"
description = "Spirit Agent — 统一后端 AI Agent，服务 VSCode / Web / CLI / 消息平台"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "prompt-toolkit>=3.0",
    "pydantic>=2.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
spirit = "spirit.cli.main:cli"

[tool.setuptools.packages.find]
include = ["spirit*"]

[tool.ruff]
line-length = 100
target-version = "py311"
